<script>
        // ĐÃ THÔNG MẠCH: Dán chính xác 2 đường link Firebase Functions thực tế của bạn vào đây
        const URL_ASK_TIMON = "https://asktimon-udi5dknsya-uc.a.run.app";
        const URL_SEND_LEAD = "https://sendlead-udi5dknsya-uc.a.run.app";

        let hondaContext = "";
        let chatHistory = [];
        let historicalLeads = new Set();

        // Đồng bộ dữ liệu tệp tin từ Repo tĩnh của GitHub Pages
        async function loadLocalDatabase() {
            try {
                const resInv = await fetch('data/inventory.json').then(r => r.text());
                const resPrice = await fetch('data/pricing_calc.json').then(r => r.text());
                const resService = await fetch('data/service.json').then(r => r.text());
                hondaContext = `=== DATA ĐẠI LÝ ===\n${resInv}\n${resPrice}\n${resService}`;
                console.log("Database nạp thành công!");
            } catch (e) {
                console.error("Lỗi nạp database:", e);
                hondaContext = "Dữ liệu đại lý tạm thời chưa đồng bộ.";
            }
        }
        loadLocalDatabase();

        // Hàm xử lý gửi tin nhắn chính thức
        async function handleSendMessage() {
            const inputDel = document.getElementById('user-input');
            const text = inputDel.value.trim();
            if(!text) return; 

            appendMessage(text, 'user');
            inputDel.value = ''; 
            scrollToBottom();

            chatHistory.push(`Khách hàng: ${text}`);
            checkAndSaveLead(text);

            showThinkingMessage();
            inputDel.disabled = true; 

            // Giới hạn lịch sử chat gửi lên để né bộ lọc bóp băng thông TPM của Google
            const limitedHistory = chatHistory.slice(-4).join("\n");

            const systemPrompt = `
            Bạn là một Chuyên viên tư vấn ảo cao cấp tên là Timon, làm việc tại đại lý Ô tô Honda Đồng Tháp.
            Nhiệm vụ của bạn là tư vấn bán hàng, giải đáp thông số, tính toán chi phí và chốt hẹn khách hàng mua xe dựa trên cơ sở dữ liệu dưới đây.

            ---
            CƠ SỞ DỮ LIỆU ĐẠI LÝ:
            ${hondaContext}
            ---

            QUY TẮC TƯ DUY VÀ XỬ LÝ TOÁN HỌC (BẮT BUỘC):
            1. Trò chuyện tự nhiên, chuyên nghiệp như một tư vấn viên ô tô lão luyện. KHÔNG trả lời rập khuôn máy móc.
            2. Chỉ tư vấn thông tin dựa trên dữ liệu được cung cấp. Nếu khách hỏi thông tin hoang đường hoặc các nhân vật lạ không có trong hệ thống, hãy lịch sự từ chối khéo và hướng cuộc trò chuyện về các dòng xe Honda (City, Civic, CR-V, HR-V, BR-V, Accord).
            3. Tính toán chi phí lăn bánh: Lấy giá niêm yết của xe từ inventory.json, tính thuế trước bạ 10%, phí biển số khu vực II (1,000,000đ cho Cao Lãnh) hoặc khu vực III (200,000đ cho Huyện), kết hợp cộng các phí cố định (Kiểm định: 230k, Đường bộ: 1560k, Bảo hiểm TNDS: 480.7k). In rõ ràng phép tính tổng ra màn hình.
            4. Khéo léo gài khách để lại số điện thoại/Zalo để phòng kinh doanh gửi bảng giá kịch sàn hôm nay.

            Lịch sử cuộc trò chuyện gần đây:
            ${limitedHistory}

            Timon phản hồi:`;

            try {
                // BẮN TIN NHẮN QUA SERVER TRUNG GIAN FIREBASE (KHÔNG CÒN LỘ API KEY)
                const response = await fetch(URL_ASK_TIMON, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: systemPrompt })
                });

                const data = await response.json();
                
                // Trình duyệt bốc cấu trúc dữ liệu text từ Firebase trả về cực gọn
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    
                    removeThinkingMessage();
                    inputDel.disabled = false; 
                    appendMessage(replyText, 'bot');
                    chatHistory.push(`Timon: ${replyText}`);
                    scrollToBottom();
                } else {
                    throw new Error("Lỗi định dạng cấu trúc JSON trả về.");
                }

            } catch (error) {
                console.error("API Error:", error);
                removeThinkingMessage();
                inputDel.disabled = false; 
                appendMessage('Hệ thống xử lý thông tin đang bận cập nhật dữ liệu bảng giá. Anh/Chị vui lòng thử lại sau giây lát hoặc để lại số điện thoại để Timon hỗ trợ ngay nhé! 🥺', 'bot');
                scrollToBottom();
            }
        }

        // Tự động quét bắt SĐT khách
        function checkAndSaveLead(inputText) {
            const phoneRegex = /(03|05|07|08|09|01[2|6|8|9])+([0-9]{8})\b/g;
            const foundPhones = inputText.match(phoneRegex);

            if (foundPhones) {
                foundPhones.forEach(phone => {
                    if (!historicalLeads.has(phone)) {
                        historicalLeads.add(phone);
                        const newLead = {
                            time: new Date().toLocaleString('vi-VN'),
                            phone: phone,
                            rawContent: inputText
                        };
                        sendToTelegram(newLead); 
                    }
                });
            }
        }

        // BẮN SĐT KHÁCH QUA ENDPOINT BẢO MẬT CỦA FIREBASE
        async function sendToTelegram(leadData) {
            try {
                await fetch(URL_SEND_LEAD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        time: leadData.time,
                        phone: leadData.phone,
                        rawContent: leadData.rawContent
                    })
                });
                console.log("Đã lưu data khách về hệ thống an toàn!");
            } catch (e) { 
                console.error("Lỗi đồng bộ dữ liệu Telegram:", e); 
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', sender);
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            document.getElementById('messages').appendChild(msgDiv);
        }
        
        function showThinkingMessage() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.id = 'thinking-indicator';
            thinkingDiv.classList.add('thinking-msg');
            thinkingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            document.getElementById('messages').appendChild(thinkingDiv);
            scrollToBottom();
        }
        
        function removeThinkingMessage() { const td = document.getElementById('thinking-indicator'); if (td) td.remove(); }
        function scrollToBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }

        // Bộ lắng nghe kích hoạt sự kiện click cứng cựa ăn chắc 100%
        document.getElementById("send-btn").onclick = handleSendMessage;
        document.getElementById("user-input").onkeypress = function(event) {
            if (event.key === 'Enter') {
                handleSendMessage();
            }
        };
    </script>
