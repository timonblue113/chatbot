<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Ôtô Đồng Tháp - Trợ Lý Ảo Timon</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --honda-red: #cc0000;
            --honda-black: #111111;
            --honda-text: #222222;
            --honda-white: #ffffff;
            --bg-user-msg: #cc0000;
            --bg-bot-msg: rgba(240, 242, 245, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px;
        }
        #chat-box {
            width: 100%; max-width: 480px; height: calc(100% - 20px); 
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #chat-header { background-color: var(--honda-red); color: var(--honda-white); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
        #chat-header h1 { font-size: 1.15rem; font-weight: 600; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.45; max-width: 82%; word-wrap: break-word; }
        .user { background-color: var(--bg-user-msg); color: var(--honda-white); align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background-color: var(--bg-bot-msg); color: var(--honda-black); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.05); }
        #input-area { display: flex; padding: 15px; border-top: 1px solid rgba(0, 0, 0, 0.06); background-color: rgba(255, 255, 255, 0.95); align-items: center; }
        #user-input { flex: 1; padding: 12px 20px; border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 25px; outline: none; background-color: rgba(240, 242, 245, 0.8); }
        #send-btn { background-color: var(--honda-red); color: var(--honda-white); border: none; width: 44px; height: 44px; margin-left: 10px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.15rem; }

        .thinking-msg { display: flex; gap: 5px; padding: 12px 18px; border-radius: 18px; background-color: var(--bg-bot-msg); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.05); width: fit-content; }
        .dot { width: 8px; height: 8px; background-color: rgba(0, 0, 0, 0.5); border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        #user-input:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="chat-box">
        <div id="chat-header">
            <div>
                <h1>Honda Ôtô Đồng Tháp</h1>
                <span>Trợ lý ảo Timon trực tuyến</span>
            </div>
            <div style="font-size: 1.6rem;">🚗</div>
        </div>

        <div id="messages">
            <div class="msg bot">
                🚗 Kính chào Anh/Chị! Tôi là <strong>Timon</strong> - Trợ lý công nghệ số của đại lý Honda Ôtô Đồng Tháp.<br><br>
                Hôm nay tôi có thể hỗ trợ Anh/Chị thông tin chi tiết về dòng xe nào ạ?<br>
                <em>(City, Civic, CR-V, HR-V, BR-V, Accord)</em>
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Hỏi Timon về giá xe, lăn bánh, trả góp...">
            <button type="button" id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // CHẠY SCRIPT THUẦN CHẮC CHẮN 100% KHÔNG BỊ LỖI SCOPE MODULE
        const _part1 = "QUl6YVN5RGxaSWVrZ1F6Q0dVZ2hLVEVFZVRGV2lxT3p3LURBOUxnCg==";
        
        function _getK() {
            return atob(_part1).trim();
        }

        let hondaContext = "";
        let chatHistory = [];
        let historicalLeads = new Set();

        // Load database tĩnh từ thư mục data/ của Repo
        async function loadLocalDatabase() {
            try {
                const resInv = await fetch('data/inventory.json').then(r => r.text());
                const resPrice = await fetch('data/pricing_calc.json').then(r => r.text());
                const resService = await fetch('data/service.json').then(r => r.text());
                hondaContext = `=== DATA ĐẠI LÝ ===\n${resInv}\n${resPrice}\n${resService}`;
                console.log("Database nạp thành công!");
            } catch (e) {
                console.error("Lỗi nạp database:", e);
                hondaContext = "Dữ liệu đại lý tạm thời chưa đồng bộ.";
            }
        }
        loadLocalDatabase();

        // Xử lý gửi tin nhắn chính thức
        async function handleSendMessage() {
            const inputDel = document.getElementById('user-input');
            const text = inputDel.value.trim();
            if(!text) return; 

            appendMessage(text, 'user');
            inputDel.value = ''; 
            scrollToBottom();

            chatHistory.push(`Khách hàng: ${text}`);
            checkAndSaveLead(text);

            showThinkingMessage();
            inputDel.disabled = true; 

            // Giới hạn lịch sử chat gửi lên để né bộ lọc bóp băng thông TPM của Google
            const limitedHistory = chatHistory.slice(-4).join("\n");

            const systemPrompt = `
            Bạn là một Chuyên viên tư vấn ảo cao cấp tên là Timon, làm việc tại đại lý Ô tô Honda Đồng Tháp.
            Nhiệm vụ của bạn là tư vấn bán hàng, giải đáp thông số, tính toán chi phí và chốt hẹn khách hàng mua xe dựa trên cơ sở dữ liệu dưới đây.

            ---
            CƠ SỞ DỮ LIỆU ĐẠI LÝ:
            ${hondaContext}
            ---

            QUY TẮC TƯ DUY VÀ XỬ LÝ TOÁN HỌC (BẮT BUỘC):
            1. Trò chuyện tự nhiên, chuyên nghiệp như một tư vấn viên ô tô lão luyện. KHÔNG trả lời rập khuôn máy móc.
            2. Chỉ tư vấn thông tin dựa trên dữ liệu được cung cấp. Nếu khách hỏi thông tin hoang đường hoặc các nhân vật lạ không có trong hệ thống, hãy lịch sự từ chối khéo và hướng cuộc trò chuyện về các dòng xe Honda (City, Civic, CR-V, HR-V, BR-V, Accord).
            3. Tính toán chi phí lăn bánh: Lấy giá niêm yết của xe từ inventory.json, tính thuế trước bạ 10%, phí biển số khu vực II (1,000,000đ cho Cao Lãnh) hoặc khu vực III (200,000đ cho Huyện), kết hợp cộng các phí cố định (Kiểm định: 230k, Đường bộ: 1560k, Bảo hiểm TNDS: 480.7k). In rõ ràng phép tính tổng ra màn hình.
            4. Khéo léo gài khách để lại số điện thoại/Zalo để phòng kinh doanh gửi bảng giá kịch sàn hôm nay.

            Lịch sử cuộc trò chuyện gần đây:
            ${limitedHistory}

            Timon phản hồi:`;

            try {
                const apiKey = _getK();
                // Endpoint REST chuẩn xác của Gemini API
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const data = await response.json();
                
                // Bốc chuẩn xác cấu trúc JSON phản hồi từ API Google (Fix lỗi đứng chân)
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    
                    removeThinkingMessage();
                    inputDel.disabled = false; 
                    appendMessage(replyText, 'bot');
                    chatHistory.push(`Timon: ${replyText}`);
                    scrollToBottom();
                } else {
                    // Nếu Google trả về lỗi định dạng hoặc key chết
                    throw new Error(data.error ? data.error.message : "Lỗi phản hồi hệ thống.");
                }

            } catch (error) {
                console.error("API Error:", error);
                removeThinkingMessage();
                inputDel.disabled = false; 
                appendMessage('Hệ thống xử lý thông tin đang bận cập nhật dữ liệu bảng giá. Anh/Chị vui lòng thử lại sau giây lát hoặc để lại số điện thoại để Timon hỗ trợ ngay nhé! 🥺', 'bot');
                scrollToBottom();
            }
        }

        // Tự động bắt SĐT
        function checkAndSaveLead(inputText) {
            const phoneRegex = /(03|05|07|08|09|01[2|6|8|9])+([0-9]{8})\b/g;
            const foundPhones = inputText.match(phoneRegex);

            if (foundPhones) {
                foundPhones.forEach(phone => {
                    if (!historicalLeads.has(phone)) {
                        historicalLeads.add(phone);
                        const newLead = {
                            time: new Date().toLocaleString('vi-VN'),
                            phone: phone,
                            rawContent: inputText
                        };
                        sendToTelegram(newLead); 
                    }
                });
            }
        }

        // Đồng bộ dữ liệu real-time về Telegram
        async function sendToTelegram(leadData) {
            const botToken = "8221429460:AAG5rdvIFqsw_7JisbLOqBafCZnDj2tjtJk";
            const chatId = "6063497942";
            const message = `🔔 *CÓ KHÁCH HÀNG MỚI!*\n⏱ Thời gian: ${leadData.time}\n📞 Số điện thoại: \`${leadData.phone}\`\n💬 Nội dung: ${leadData.rawContent}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
                });
            } catch (e) { console.error("Lỗi đồng bộ Telegram:", e); }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', sender);
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            document.getElementById('messages').appendChild(msgDiv);
        }
        
        function showThinkingMessage() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.id = 'thinking-indicator';
            thinkingDiv.classList.add('thinking-msg');
            thinkingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            document.getElementById('messages').appendChild(thinkingDiv);
            scrollToBottom();
        }
        
        function removeThinkingMessage() { const td = document.getElementById('thinking-indicator'); if (td) td.remove(); }
        function scrollToBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }

        // Gắn sự kiện cứng trực tiếp ở scope ngoài cùng
        document.getElementById("send-btn").onclick = handleSendMessage;
        document.getElementById("user-input").onkeypress = function(event) {
            if (event.key === 'Enter') {
                handleSendMessage();
            }
        };
    </script>
</body>
</html>
