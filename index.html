<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honda Ôtô Đồng Tháp - Trợ Lý Ảo Timon</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --honda-red: #cc0000;
            --honda-black: #111111;
            --honda-text: #222222;
            --honda-white: #ffffff;
            --bg-user-msg: #cc0000;
            --bg-bot-msg: rgba(240, 242, 245, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px;
        }
        #chat-box {
            width: 100%; max-width: 480px; height: calc(100% - 20px); 
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #chat-header { background-color: var(--honda-red); color: var(--honda-white); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        #chat-header h1 { font-size: 1.15rem; font-weight: 600; }
        #chat-header span { font-size: 0.8rem; opacity: 0.85; }
        
        /* NÚT XUẤT DATA KHÁCH HÀNG */
        #export-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255,255,255,0.4); color: white;
            padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
        }
        #export-btn:hover { background: white; color: var(--honda-red); }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.45; max-width: 82%; word-wrap: break-word; }
        .user { background-color: var(--bg-user-msg); color: var(--honda-white); align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background-color: var(--bg-bot-msg); color: var(--honda-black); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.05); }
        #input-area { display: flex; padding: 15px; border-top: 1px solid rgba(0, 0, 0, 0.06); background-color: rgba(255, 255, 255, 0.95); align-items: center; }
        #user-input { flex: 1; padding: 12px 20px; border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 25px; outline: none; background-color: rgba(240, 242, 245, 0.8); }
        #send-btn { background-color: var(--honda-red); color: var(--honda-white); border: none; width: 44px; height: 44px; margin-left: 10px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.15rem; }

        .thinking-msg { display: flex; gap: 5px; padding: 12px 18px; border-radius: 18px; background-color: var(--bg-bot-msg); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.05); width: fit-content; }
        .dot { width: 8px; height: 8px; background-color: rgba(0, 0, 0, 0.5); border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        #user-input:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="chat-box">
        <div id="chat-header">
            <div>
                <h1>Honda Ôtô Đồng Tháp</h1>
                <span>Trợ lý ảo Timon trực tuyến</span>
            </div>
            <button id="export-btn" onclick="exportLeads()">Xuất Data 📑</button>
        </div>

        <div id="messages">
            <div class="msg bot">
                🚗 Kính chào Anh/Chị! Tôi là <strong>Timon</strong>. Hôm nay tôi có thể hỗ trợ Anh/Chị thông tin chi tiết về dòng xe nào ạ?
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Hỏi Timon về xe Honda..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyDamvWLONSm2yHF5JnAxFQwC7LDUg3s_gU"; 
        let hondaContext = "";
        let chatHistory = [];
        
        // Mảng lưu trữ thông tin khách hàng lọc được trong phiên chat
        let customerLeads = []; 

        async function loadLocalDatabase() {
            try {
                const resInv = await fetch('data/inventory.json').then(r => r.text());
                const resPrice = await fetch('data/pricing_calc.json').then(r => r.text());
                const resService = await fetch('data/service.json').then(r => r.text());
                hondaContext = `=== DATA ===\n${resInv}\n${resPrice}\n${resService}`;
            } catch (e) {
                console.error("Lỗi nạp database:", e);
                hondaContext = "Dữ liệu đại lý tạm thời chưa đồng bộ.";
            }
        }
        loadLocalDatabase();

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const inputDel = document.getElementById('user-input');
            const text = inputDel.value.trim();
            if(!text) return; 

            appendMessage(text, 'user');
            inputDel.value = ''; 
            scrollToBottom();

            chatHistory.push(`Khách hàng: ${text}`);

            // == HỆ THỐNG KIỂM TRA & LỌC THÔNG TIN LIÊN LẠC (LEAD CAPTURE) ==
            checkAndSaveLead(text);

            showThinkingMessage();
            inputDel.disabled = true; 

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                // Cấu hình System Instruction ép tư duy Sales trực tiếp
                const systemPrompt = `Bạn là Timon - Sales Agent của Honda Ôtô Đồng Tháp. Dùng data sau để trả lời: ${hondaContext}\nQuy tắc: Thân thiện, khôn khéo gài xin SĐT. Lịch sử: ${chatHistory.join("\n")}\nTimon phản hồi:`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });

                const data = await response.json();
                const replyText = data.candidates[0].content.parts[0].text;
                
                removeThinkingMessage();
                inputDel.disabled = false; 
                appendMessage(replyText, 'bot');
                chatHistory.push(`Timon: ${replyText}`);
                scrollToBottom();

            } catch (error) {
                console.error(error);
                removeThinkingMessage();
                inputDel.disabled = false; 
                appendMessage('Mạng lag quá, Anh/Chị thử lại giúp Timon nhé!', 'bot');
                scrollToBottom();
            }
        }

        // == HÀM TỰ ĐỘNG PHÂN TÍCH VÀ TRÍCH XUẤT SĐT/THÔNG TIN KHÁCH ==
        function checkAndSaveLead(inputText) {
            // Sử dụng Regex bắt mọi định dạng số điện thoại Việt Nam thông dụng (09x, 03x, 07x, 08x...)
            const phoneRegex = /(03|05|07|08|09|01[2|6|8|9])+([0-9]{8})\b/g;
            const foundPhones = inputText.match(phoneRegex);

            if (foundPhones) {
                foundPhones.forEach(phone => {
                    // Kiểm tra xem số này đã được lưu trong phiên làm việc chưa
                    if (!customerLeads.some(lead => lead.phone === phone)) {
                        const newLead = {
                            time: new Date().toLocaleString('vi-VN'),
                            phone: phone,
                            rawContent: inputText // Lưu nguyên văn câu chat để biết khách quan tâm xe gì
                        };
                        customerLeads.push(newLead);
                        console.log("Đã lưu Lead mới:", newLead);
                        
                        // [TÙY CHỌN]: Bắn dữ liệu tự động về Telegram hoặc Google Sheets tại đây
                        // sendToTelegram(newLead);
                    }
                });
            }
        }

        // == HÀM XUẤT FILE CSV/EXCEL TÙY BIẾN THỦ CÔNG ==
        function exportLeads() {
            if (customerLeads.length === 0) {
                alert("Hiện tại chưa có khách hàng nào để lại số điện thoại trong phiên chat này!");
                return;
            }

            // Tạo cấu trúc nội dung file CSV bằng mã hóa UTF-8 Bom để không bị lỗi font tiếng Việt khi mở bằng Excel
            let csvContent = "\uFEFFTime,Số Điện Thoại,Nội Dung Khách Gõ\n";
            customerLeads.forEach(lead => {
                // Xóa bỏ dấu phẩy trong nội dung gốc tránh làm lệch cột CSV
                let cleanContent = lead.rawContent.replace(/,/g, " - ");
                csvContent += `${lead.time},${lead.phone},${cleanContent}\n`;
            });

            // Tạo trigger tải file về máy khách
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Danh_Sach_Khach_Hang_Honda_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // == HOẶC CHƠI HỆ TỰ ĐỘNG BẮN DATA VỀ TELEGRAM (NẾU MUỐN BẬT) ==
        async function sendToTelegram(leadData) {
            const botToken = "8221429460:AAG5rdvIFqsw_7JisbLOqBafCZnDj2tjtJk";
            const chatId = "6063497942";
            const message = `🔔 *CÓ KHÁCH HÀNG MỚI!*\n⏱ Thời gian: ${leadData.time}\n📞 Số điện thoại: \`${leadData.phone}\`\n💬 Nội dung: ${leadData.rawContent}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
                });
            } catch (e) { console.error("Lỗi bắn Telegram:", e); }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', sender);
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            document.getElementById('messages').appendChild(msgDiv);
        }
        function showThinkingMessage() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.id = 'thinking-indicator';
            thinkingDiv.classList.add('thinking-msg');
            thinkingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            document.getElementById('messages').appendChild(thinkingDiv);
            scrollToBottom();
        }
        function removeThinkingMessage() { const td = document.getElementById('thinking-indicator'); if (td) td.remove(); }
        function scrollToBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }
    </script>
</body>
</html>
